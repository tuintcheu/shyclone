# Un seul service : il compile l'interface et la sert avec l'API.
# À recréer à la main dans le tableau de bord si le blueprint est refusé —
# il n'a pas pu être testé sur un compte réel.
services:
  - type: web
    name: shyclone
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      # Mot de passe d'accès à l'application. Render en génère un : relevez-le
      # dans Environment, l'identifiant est « shy ». Supprimez cette ligne pour
      # une application ouverte à qui connaît l'URL.
      - key: SHYCLONE_MDP
        generateValue: true
      - key: SHYCLONE_RETENTION
        value: "780"            # 13 min avant suppression d'une capture
