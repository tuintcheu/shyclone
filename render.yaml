# Un seul service : il compile l'interface et la sert avec l'API.
# À recréer à la main dans le tableau de bord si le blueprint est refusé —
# il n'a pas pu être testé sur un compte réel.
services:
  - type: web
    name: shyclone
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: SHYCLONE_RETENTION
        value: "780"            # 13 min avant suppression d'une capture
      - key: SHYCLONE_QUOTA_CLONE
        value: "12"             # captures par visiteur et par heure

      # Application ouverte à tous par défaut. Pour la réserver à vous seul,
      # ajoutez SHYCLONE_MDP dans l'onglet Environment : l'interface, l'API et
      # l'aperçu demandent alors un mot de passe, l'identifiant étant « shy ».
      # La sonde /api/health reste ouverte, sinon Render déclare le service en
      # panne et le redémarre en boucle.
